spring.application.name=MEOW
server.address=${MEOW_HOST:127.0.0.1}
server.port=${MEOW_PORT:8000}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${MEOW_DATABASE_URL:jdbc:h2:file:./instance/meow;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=sa
spring.datasource.password=${MEOW_DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=42MB
spring.jackson.deserialization.fail-on-trailing-tokens=true
meow.seed-demo=${MEOW_SEED_DEMO:false}
meow.cookie-secure=${MEOW_COOKIE_SECURE:false}
meow.upload-directory=${MEOW_UPLOAD_DIRECTORY:./instance/uploads}

meow.sequence-trace=false
